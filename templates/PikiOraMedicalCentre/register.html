{% extends '../base.html' %}
{% block title %}
    Register
{% endblock %}
{% block content %}
    <h1 style="margin: 20px;">Register</h1>
    <form style="margin-left: 20px;" method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <table>{{ form.as_table }}</table>
        <button style="margin-top: 20px;" class="btn btn-primary" type="submit">Register</button>
    </form>
    
{% endblock %}
